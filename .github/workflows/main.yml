name: Build APKs

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      singbox_ref:
        description: "sing-box tag (the libbox library is built from it)"
        default: "v1.13.21"

permissions:
  contents: write

env:
  SINGBOX_REF: ${{ inputs.singbox_ref || 'v1.13.21' }}

jobs:
  libbox:
    name: sing-box library (libbox)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.SINGBOX_REF }}
          path: sing-box
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Same gomobile fork, flags and Java package as sing-box's own Android build
      # (cmd/internal/build_libbox). Features: gVisor TUN stack, QUIC (Hysteria2 / TUIC), WireGuard,
      # uTLS (fingerprints, Reality) and the Clash API (live switching, real delay, counters).
      - name: Build libbox.aar
        working-directory: sing-box
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          export PATH="$PATH:$(go env GOPATH)/bin"
          version="${SINGBOX_REF#v}"
          gomobile bind -v \
            -o libbox.aar \
            -target android/arm,android/arm64,android/amd64 \
            -androidapi 23 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -trimpath -buildvcs=false \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${version} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -s -w -buildid= -checklinkname=0" \
            -tags "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0" \
            ./experimental/libbox
          ls -l libbox.aar

      - uses: actions/upload-artifact@v4
        with:
          name: libbox
          path: sing-box/libbox.aar
          if-no-files-found: error

  apk:
    name: Build APKs
    needs: [libbox]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: libbox
          path: app/libs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode keystore (optional)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret: signing with the debug key."
          fi

      - name: Assemble release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cd app/build/outputs/apk/release
          ls -l
          cp *armeabi-v7a*.apk ../../../../../out/8ray-armeabi-v7a.apk
          cp *arm64-v8a*.apk   ../../../../../out/8ray-arm64-v8a.apk
          cp *universal*.apk   ../../../../../out/8ray-universal.apk
          ls -l ../../../../../out

      - uses: actions/upload-artifact@v4
        with:
          name: 8ray-apks
          path: out/*.apk
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
